name: Replay on Linux and macOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replay-platforms.yml'
      - 'capx_trace_viewer/**'
      - 'capx_trace_recorder/**'
      - 'web-ui/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Start-Replay.sh'
      - 'demo/**'
      - 'pyproject.toml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev,demo]'
      - name: Test backend and safe file access
        run: |
          mkdir -p outputs/ci-checks
          python -m pytest tests -q --junitxml=outputs/ci-checks/pytest.xml
      - name: Install frontend dependencies
        working-directory: web-ui
        run: npm ci
      - name: Test frontend
        working-directory: web-ui
        run: npm run test:trace
      - name: Build frontend
        working-directory: web-ui
        run: npm run build
      - name: Install Chromium and Linux libraries
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium for macOS
        if: runner.os == 'macOS'
        run: python -m playwright install chromium
      - name: Generate synthetic recording and trace
        run: python scripts/make_replay_demo.py --out outputs/ci-demo
      - name: Generate three-camera synthetic recording
        run: python scripts/make_replay_demo.py --out outputs/ci-multi-camera --cameras 3
      - name: Run browser replay acceptance
        run: python scripts/demo/check_replay_platform.py --fixture outputs/ci-demo --out outputs/ci-checks
      - name: Run multi-camera browser acceptance
        run: python scripts/demo/check_replay_platform.py --fixture outputs/ci-multi-camera --out outputs/ci-checks/multi-camera --multi-camera
      - name: Preserve synthetic verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: replay-${{ matrix.os }}
          path: outputs/ci-checks/
          retention-days: 7
          if-no-files-found: warn
